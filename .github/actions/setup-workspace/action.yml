name: Set up the Foundry workspace
description: Node, npm, dependencies (Angular 21 or 22) and Playwright browsers for a CI job.

inputs:
  node-version:
    description: Node line to install (22, 24 or 26).
    required: true
  angular:
    description: '21: the development workspace and its lockfile. 22: tools/ci/angular-22 and its own lockfile.'
    required: false
    default: '21'
  browsers:
    description: 'Comma-separated Playwright browsers (chromium,firefox,webkit), or none. Also sets FOUNDRY_TEST_BROWSERS.'
    required: false
    default: none
  browsers-preinstalled:
    description: "'true' when the job runs in the Playwright image, which already has the browsers and their system packages."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        # Without it, setup-node may take an older release of the line cached on the runner.
        check-latest: true
        cache: npm
        cache-dependency-path: ${{ inputs.angular == '22' && 'tools/ci/angular-22/package-lock.json' || 'package-lock.json' }}

    # Node 22 ships npm 10, which ignores allowScripts and would run every install script.
    - name: Pin npm 11.21.3 (allowScripts policy)
      shell: bash
      run: |
        npm install --global npm@11.21.3 --no-fund --no-audit --loglevel=error
        echo "npm $(npm --version)"

    - name: Install dependencies (Angular 21, development lockfile)
      if: inputs.angular == '21'
      shell: bash
      run: npm ci --strict-allow-scripts --no-fund --no-audit

    # Linking its node_modules at the root makes the workspace resolve Angular 22 without touching the development lockfile.
    - name: Install dependencies (Angular 22, own lockfile)
      if: inputs.angular == '22'
      shell: bash
      run: |
        npm ci --strict-allow-scripts --no-fund --no-audit --prefix tools/ci/angular-22
        ln -s tools/ci/angular-22/node_modules node_modules

    - name: Export the test environment
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        ANGULAR: ${{ inputs.angular }}
      run: |
        echo "FOUNDRY_TEST_BROWSERS=$BROWSERS" >> "$GITHUB_ENV"
        echo "FOUNDRY_EXPECTED_ANGULAR_MAJOR=$ANGULAR" >> "$GITHUB_ENV"
        angular_version=$(node -p "require('./node_modules/@angular/core/package.json').version")
        typescript_version=$(node -p "require('./node_modules/typescript/package.json').version")
        echo "Angular $angular_version, TypeScript $typescript_version, browsers: $BROWSERS"

    - name: Read the Playwright version
      id: playwright
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PREINSTALLED: ${{ inputs.browsers-preinstalled }}
      run: |
        if [ "$PREINSTALLED" = "true" ] || [ "$BROWSERS" = "none" ]; then
          echo "install=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "install=true" >> "$GITHUB_OUTPUT"
        echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "list=${BROWSERS//,/ }" >> "$GITHUB_OUTPUT"
        echo "key=${BROWSERS//,/-}" >> "$GITHUB_OUTPUT"

    - name: Cache the Playwright browsers
      id: playwright-cache
      if: steps.playwright.outputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.key }}

    - name: Install the Playwright browsers
      if: steps.playwright.outputs.install == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --only-shell ${{ steps.playwright.outputs.list }}

    # Also on a cache hit, which keeps no system packages; the runner image has those of Chrome, so Chromium alone skips it.
    - name: Install the system packages of the browsers
      if: steps.playwright.outputs.install == 'true' && inputs.browsers != 'chromium'
      shell: bash
      run: npx playwright install-deps ${{ steps.playwright.outputs.list }}
