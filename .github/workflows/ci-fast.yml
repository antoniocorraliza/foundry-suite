# Push only: GitHub takes the check of the head commit of a pull request from the push.
name: CI fast

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # Required check of main: "Fast level". Do not rename it without changing the rule.
    name: Fast level
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so that the commits of the branch can be compared with origin/main.
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '24'
          angular: '21'
          browsers: chromium

      - name: Check the commit messages
        run: node tools/ci/check-commits.ts origin/main..HEAD

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Lint and type-check
        run: npm run lint

      - name: Warm up Vite
        run: npm run test:warmup

      - name: Unit tests with coverage (Node and Chromium)
        run: npm run test:coverage

      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-screenshots-fast
          path: .vitest/attachments
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Check the packages
        run: npm run check:packages

      - name: Check the size of each entry
        run: npm run size

      - name: Check the changelog of the entries that grew
        run: npm run size:changelog -- origin/main
