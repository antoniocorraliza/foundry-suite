# Separate from the full level so that editing the title runs it again without running the whole level.
name: Pull request title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The title is passed through the environment, never written into the script.
      - name: Check the title (it becomes the squash commit)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node tools/ci/check-commits.ts --title "$TITLE"
