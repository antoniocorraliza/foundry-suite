name: CI full

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Skip the night run if main is unchanged
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Compare main with the last successful full run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh api "repos/$REPOSITORY/actions/workflows/ci-full.yml/runs?branch=main&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // ""' || echo "")
          if [ -n "$last" ] && [ "$last" = "$SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main ($SHA) already passed the full level: night run skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "main is $SHA; last successful full run on main: ${last:-none}. Running." >> "$GITHUB_STEP_SUMMARY"
          fi

  unit-node:
    name: Unit - Angular ${{ matrix.angular }} - Node 22
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        angular: ${{ fromJSON(github.event_name == 'pull_request' && '["21"]' || '["21", "22"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '22'
          angular: ${{ matrix.angular }}
          browsers: none

      - name: Unit tests (zone.js and zoneless; Node only)
        run: npm test

      - name: Build
        if: matrix.angular == '21'
        run: npm run build

      - name: Check the packages
        if: matrix.angular == '21'
        run: npm run check:packages

  # Its tag must match the Playwright version of both lockfiles.
  unit-browsers:
    name: Unit - Angular ${{ matrix.angular }} - Node 24 - browsers
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      # Firefox refuses to run as root in this image: use the runner's user.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        angular: ${{ fromJSON(github.event_name == 'pull_request' && '["21"]' || '["21", "22"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '24'
          angular: ${{ matrix.angular }}
          browsers: chromium,firefox,webkit
          browsers-preinstalled: 'true'

      - name: Warm up Vite
        run: npm run test:warmup

      - name: Unit tests (zone.js and zoneless; Chromium, Firefox and WebKit)
        run: npm test

      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-screenshots-angular-${{ matrix.angular }}
          path: .vitest/attachments
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit development dependencies (report only)
        if: matrix.angular == '21'
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node tools/ci/audit-report.ts "$RUNNER_TEMP/npm-audit.json"

  smoke-node-26:
    name: Smoke - Node 26
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '26'
          angular: '21'
          browsers: none

      - name: Smoke tests
        run: npx vitest run --project "smoke:*"

      - name: Build
        run: npm run build

      - name: Check the packages
        run: npm run check:packages

  smoke-jest:
    name: Smoke - Jest 30 with jsdom
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '22'
          angular: '21'
          browsers: none

      - name: Install the Jest app (own lockfile)
        run: npm ci --strict-allow-scripts --no-fund --no-audit --prefix tools/jest-smoke

      - name: Build Utils
        run: npm run build:utils

      - name: Run Utils from its tarball under Jest
        run: npm run test:jest

  # Required check of main: "Full level". Do not rename it without changing the rule.
  # A new job joins the level by adding its id to needs, without touching the rule.
  result:
    name: Full level
    needs: [gate, unit-node, unit-browsers, smoke-node-26, smoke-jest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job of the level
        env:
          NEEDS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "Draft pull request: the full level did not run. Mark it ready for review to run it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -e '[.[] | select(.result == "failure" or .result == "cancelled")] | length == 0' > /dev/null
